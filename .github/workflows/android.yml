name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android demo APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch models + sherpa-onnx AAR
        run: android/fetch_models.sh
      - name: Core unit tests (JVM)
        working-directory: android/wakeword-core
        run: ../gradlew test --console=plain
      - name: Build demo APK
        working-directory: android
        run: ./gradlew :demo-app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: wakeword-demo-apk
          path: android/demo-app/build/outputs/apk/debug/demo-app-debug.apk
          if-no-files-found: error

  python:
    name: Python engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r python/requirements.txt
      - name: pytest (downloads ~20 MB of models)
        working-directory: python
        run: python -m pytest tests -q
